name: Refresh data

on:
    schedule:
        - cron: '0 6 * * 1'
    workflow_dispatch:

permissions:
    contents: write
    pull-requests: write

jobs:
    refresh:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: 24
            - uses: actions/setup-python@v7
              with:
                  python-version: '3.14'
            - run: npm ci
            - run: node converter.ts
            - run: npm test
            - run: pip install . && python -m unittest discover -s bindings/python/tests
            - run: cargo test
            - uses: peter-evans/create-pull-request@v8
              with:
                  branch: refresh-data
                  title: Refresh Emoji Kitchen data
                  commit-message: Refresh Emoji Kitchen data
