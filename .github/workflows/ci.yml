name: CI

on:
    push:
        branches: [master]
        tags: ['v*']
    pull_request:

permissions:
    contents: read

jobs:
    test:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                node: [20, 22, 24]
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: ${{ matrix.node }}
            - run: npm ci
            - run: npm test

    test-python:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                python: ['3.10', '3.14']
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-python@v7
              with:
                  python-version: ${{ matrix.python }}
            - run: pip install .
            - run: python -m unittest discover -s bindings/python/tests

    test-rust:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - run: cargo test

    publish-pypi:
        if: startsWith(github.ref, 'refs/tags/v')
        needs: [test, test-python, test-rust]
        runs-on: ubuntu-latest
        permissions:
            id-token: write
        steps:
            - uses: actions/checkout@v7
            - run: pipx run build --wheel
            - uses: pypa/gh-action-pypi-publish@v1.14.3

    publish-crate:
        if: startsWith(github.ref, 'refs/tags/v')
        needs: [test, test-python, test-rust]
        runs-on: ubuntu-latest
        permissions:
            id-token: write
        steps:
            - uses: actions/checkout@v7
            - uses: rust-lang/crates-io-auth-action@v1.0.6
              id: auth
            - run: cargo publish
              env:
                  CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

    publish-npm:
        if: startsWith(github.ref, 'refs/tags/v')
        needs: [test, test-python, test-rust]
        runs-on: ubuntu-latest
        permissions:
            contents: write
            id-token: write
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: 24
                  registry-url: https://registry.npmjs.org
            - run: npm ci
            - run: npm publish
            - run: awk -v v="## [${GITHUB_REF_NAME#v}]" 'index($0, v) == 1 {p = 1; next} /^## \[/ {p = 0} p' CHANGELOG.md | gh release create "$GITHUB_REF_NAME" --notes-file -
              env:
                  GH_TOKEN: ${{ github.token }}
