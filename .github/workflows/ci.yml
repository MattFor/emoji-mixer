name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install tooling
        run: python -m pip install ruff==0.16.5

      - name: Ruff
        run: |
          ruff check --output-format=github .
          ruff format --check .

      - name: Rust
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings

      - name: Prettier
        run: npx --yes prettier@3.9.6 --check .

  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: Install
        run: npm ci

      - name: Tests
        run: npm test

  test-python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: pip install .

      - name: Tests
        run: python -m unittest discover -s bindings/python/tests

  test-rust:
    name: Rust
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Tests
        run: cargo test

  test-go:
    name: Go ${{ matrix.go }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        go: ['1.21', '1.27']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache: false

      - name: Format
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Tests
        run: go test -race ./...

  test-jsr:
    name: Deno / JSR
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.8

      - name: Tests
        run: deno test --allow-env --allow-read bindings/node/index.test.mjs
        env:
          EMOJI_MIXER_ENTRY: ./index.ts

      - name: Package check
        run: deno publish --dry-run --set-version "$(node -p 'require("./package.json").version')"

  test-php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.5']
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer
          coverage: none

      - name: Validate
        run: composer validate --strict

      - name: Syntax
        run: for f in bindings/php/src/*.php bindings/php/tests/*.php; do php -l "$f"; done

      - name: Tests
        run: |
          composer dump-autoload
          php bindings/php/tests/EmojiMixerTest.php

  test-ruby:
    name: Ruby ${{ matrix.ruby }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.3', '4.0']
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}

      - name: Syntax
        run: for f in emoji_mixer.gemspec bindings/ruby/lib/*.rb bindings/ruby/test/*.rb; do ruby -wc "$f"; done

      - name: Tests
        run: ruby -w -Ibindings/ruby/lib bindings/ruby/test/test_emoji_mixer.rb

      - name: Build the gem
        run: gem build emoji_mixer.gemspec

  test-dotnet:
    name: .NET
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Format
        run: dotnet format bindings/dotnet/EmojiMixer.slnx --verify-no-changes

      - name: Tests
        run: dotnet run --project bindings/dotnet/EmojiMixer.Tests -c Release

      - name: Pack
        run: dotnet pack bindings/dotnet/EmojiMixer/EmojiMixer.csproj -c Release -o nupkg
